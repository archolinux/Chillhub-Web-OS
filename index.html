<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Hub Web OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Wallpaper Layer -->
    <div class="desktop-background">
      
        <!-- Left Side Desktop App Shortcuts -->
        <div class="shortcut-container">
            <button class="icon-btn" onclick="openApp('gameApp')">🎮 Games Hub</button>
        </div>

        <!-- Central Application Window -->
        <div id="gameApp" class="app-window active">
            <div class="window-header">
                <span>Chill Hub v1.4 - Games Dashboard</span>
                <button class="close-btn" onclick="closeApp('gameApp')">✖</button>
            </div>
            <div class="window-content">
                <iframe src="https://freezenova.cloud" width="100%" height="100%" frameborder="0"></iframe>
            </div>
        </div>

        <!-- System Bottom Taskbar Layout Section -->
        <div class="taskbar">
            <button class="start-menu-btn" onclick="alert('Start Menu features coming soon!')">🔮 Start</button>
            
            <!-- Quick tab indicator tracking open windows -->
            <div class="taskbar-apps">
                <div class="taskbar-app-tab active-tab" onclick="openApp('gameApp')">🎮 Games Hub</div>
            </div>
            
            <!-- Relocated power button nested inside the taskbar tray -->
            <button class="power-btn" onclick="triggerRestart()">🔄 Restart OS</button>
        </div>

    </div>

    <!-- Full-Screen Interactive Reboot Sequence Overlay Screen -->
    <div id="restartScreen" class="restart-overlay">
        <div class="restart-box">
            <div class="spinner"></div>
            <p>Rebooting Chillhub Web OS...</p>
        </div>
    </div>

    <!-- Load interaction engine logic handler -->
    <script src="script.js"></script>
</body>
</html>
