<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Hub Web OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Wallpaper Layer -->
    <div class="desktop-background" onclick="closeStartMenu()">
      
        <!-- Windows Style Grid Desktop Shortcuts Layout -->
        <div class="shortcut-grid">
            <div class="desktop-shortcut" onclick="openApp('gameApp'); event.stopPropagation();">
                <div class="shortcut-icon">🎮</div>
                <div class="shortcut-text">Games Hub</div>
            </div>
            <!-- To add another desktop app shortcut in the future, just uncomment or copy the lines below: -->
            <!--
            <div class="desktop-shortcut" onclick="alert('App coming soon!'); event.stopPropagation();">
                <div class="shortcut-icon">📁</div>
                <div class="shortcut-text">My Files</div>
            </div>
            -->
        </div>

        <!-- Central Application Window Layout Frame -->
        <div id="gameApp" class="app-window active">
            <div class="window-header">
                <span>Chill Hub v1.4 - Games Dashboard</span>
                <button class="close-btn" onclick="closeApp('gameApp')">✖</button>
            </div>
            <div class="window-content">
                <iframe src="https://freezenova.cloud" width="100%" height="100%" frameborder="0"></iframe>
            </div>
        </div>

        <!-- Centered Windows-style Start Menu Flyout -->
        <div id="startMenu" class="start-menu" onclick="event.stopPropagation();">
            <div class="start-menu-header">Pinned Apps</div>
            <div class="start-menu-items">
                <button class="menu-item" onclick="openApp('gameApp'); closeStartMenu();">🎮 Games Dashboard</button>
                <button class="menu-item" onclick="alert('No system updates found!'); closeStartMenu();">ℹ️ System Status</button>
                <button class="menu-item" onclick="triggerRestart()">🔄 Restart System</button>
            </div>
        </div>

        <!-- Modern Unified Windows Bottom Taskbar UI -->
        <div class="taskbar" onclick="event.stopPropagation();">
            
            <!-- Left Side Element Spacer Placeholder -->
            <div style="width: 80px;"></div>
            
            <!-- Centered Windows Pinned Apps Core Tray -->
            <div class="taskbar-center">
                <button class="start-menu-btn" onclick="toggleStartMenu(event)">🔮</button>
                <div id="taskbarGames" class="taskbar-app-icon active-tab" onclick="openApp('gameApp')" title="Games Hub">🎮</div>
            </div>
            
            <!-- Windows Right-Side Tray: Clock & Quick Power Utility -->
            <div class="taskbar-right">
                <div id="liveClock" class="system-tray-clock">12:00 PM<br>11/10/2026</div>
                <button class="power-btn" onclick="triggerRestart()" title="Power Options">🛑</button>
            </div>
            
        </div>

    </div>

    <!-- Full-Screen Interactive Reboot Sequence Overlay Screen -->
    <div id="restartScreen" class="restart-overlay">
        <div class="restart-box">
            <div class="spinner"></div>
            <p>Restarting...</p>
        </div>
    </div>

    <!-- Load interactive operations control script -->
    <script src="script.js"></script>
</body>
</html>
